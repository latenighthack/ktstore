name: Conformance
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:
permissions:
  contents: read
jobs:
  jvm-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :library:jvmTest :browser-tests:jsBrowserDevelopmentWebpack --console=plain
      - run: npm ci --prefix browser-tests
      - run: browser-tests/node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: IndexedDB lifecycle tests
        run: |
          export CHROME_BIN="$(node -e 'process.stdout.write(require("./browser-tests/node_modules/playwright").chromium.executablePath())')"
          ./gradlew :library:jsBrowserTest --console=plain
      - run: npm test --prefix browser-tests
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: ./gradlew :library:connectedDebugAndroidTest --console=plain
  apple:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Execute native conformance and compile published variants
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            ./gradlew :library:macosArm64Test :library:iosSimulatorArm64Test --console=plain
          else
            ./gradlew :library:macosX64Test :library:iosX64Test --console=plain
          fi
          ./gradlew :library:compileKotlinIosArm64 :library:compileKotlinIosSimulatorArm64 :library:compileKotlinIosX64 :library:compileKotlinMacosArm64 :library:compileKotlinMacosX64 --console=plain
